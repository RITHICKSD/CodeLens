name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r python_frontend/requirements.txt
      - run: python -m pytest python_frontend/test_app.py -q
      - run: python -m gunicorn --check-config --bind 127.0.0.1:8000 --workers 1 --threads 8 app:app
        working-directory: python_frontend